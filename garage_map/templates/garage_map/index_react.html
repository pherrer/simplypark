{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SimplyPark Garage Map - React</title>

    <!-- Load existing CSS styles -->
    <link rel="stylesheet" href="{% static 'garage_map/css/styles.css' %}" />
    <style>
      /* Navigation styles */
      .main-nav {
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .nav-logo {
        font-size: 18px;
        font-weight: 600;
        color: #e8ecff;
        text-decoration: none;
      }

      .nav-links-list {
        display: flex;
        gap: 20px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links-list a {
        color: #aab3d6;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
        padding: 6px 12px;
        border-radius: 6px;
      }

      .nav-links-list a:hover {
        color: #e8ecff;
        background: rgba(255, 255, 255, 0.1);
      }

      .nav-links-list a.active {
        color: #2ecc71;
        background: rgba(46, 204, 113, 0.1);
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="main-nav">
      <a href="{% url 'home' %}" class="nav-logo">SimplyPark</a>
      <ul class="nav-links-list">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'garage_map_react' %}" class="active">Map</a></li>
      </ul>
    </nav>

    <!-- React root element -->
    <div id="root"></div>

    <!-- Pass Django context to JavaScript -->
    <script>
      window.GARAGE_LAYOUT_URL = "{% static 'garage_map/assets/garage_layout.json' %}?v={% now 'U' %}";
      window.GARAGE_BG_URL = "{% static 'garage_map/assets/floor1.png' %}?v={% now 'U' %}";
    </script>

    <!-- Load mock data API (keep existing mock functionality) -->
    <script src="{% static 'garage_map/js/api_mock.js' %}"></script>

    <!-- Load React bundle -->
    {% if DEBUG %}
      <!-- Development mode: Load from Vite dev server -->
      <script type="module" src="http://localhost:5173/@vite/client"></script>
      <script type="module" src="http://localhost:5173/src/main.jsx"></script>
    {% else %}
      <!-- Production mode: Load built assets -->
      <script type="module" src="{% static 'garage_map/react-dist/assets/main.js' %}"></script>
      <link rel="stylesheet" href="{% static 'garage_map/react-dist/assets/main.css' %}" />
    {% endif %}
  </body>
</html>
