{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SimplyPark - Home</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #0b1020 0%, #1a2550 100%);
        color: #e8ecff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      nav {
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .logo {
        font-size: 20px;
        font-weight: 600;
        color: #e8ecff;
      }

      .nav-links {
        display: flex;
        gap: 30px;
        list-style: none;
      }

      .nav-links a {
        color: #aab3d6;
        text-decoration: none;
        font-size: 16px;
        transition: color 0.3s;
        padding: 8px 16px;
        border-radius: 8px;
      }

      .nav-links a:hover {
        color: #e8ecff;
        background: rgba(255, 255, 255, 0.1);
      }

      .nav-links a.active {
        color: #2ecc71;
        background: rgba(46, 204, 113, 0.1);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
      }

      h1 {
        font-size: 72px;
        font-weight: 700;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 24px;
        color: #aab3d6;
        margin-bottom: 40px;
      }

      .cta-buttons {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .btn {
        padding: 14px 32px;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s;
        display: inline-block;
      }

      .btn-primary {
        background: #2ecc71;
        color: #0b1020;
      }

      .btn-primary:hover {
        background: #27ae60;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #e8ecff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 48px;
        }

        .subtitle {
          font-size: 18px;
        }

        .cta-buttons {
          flex-direction: column;
          width: 100%;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">SimplyPark</div>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}" class="active">Home</a></li>
        <li><a href="{% url 'garage_map_react' %}">Map</a></li>
      </ul>
    </nav>

    <main>
      <h1>SimplyPark</h1>
      <p class="subtitle">Smart Parking Made Simple</p>
      <div class="cta-buttons">
        <a href="{% url 'garage_map_react' %}" class="btn btn-primary">View Garage Map</a>
        <a href="{% url 'garage_map' %}" class="btn btn-secondary">Classic View</a>
      </div>
    </main>
  </body>
</html>
